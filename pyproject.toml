[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ai-gateway"
version = "1.3.0"
description = "High-Throughput Multi-Tenant AI Reverse Proxy & Semantic Cache with ONNX Embeddings and SQLite WAL"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Mihul", email = "mihulbairagi01@gmail.com"}
]
keywords = [
    "ai-gateway", "semantic-cache", "fastapi", "onnx", "fastembed", 
    "llm-proxy", "rate-limiter", "circuit-breaker", "groq", "ollama", "openai"
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "fastembed>=0.4.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
aegis = "app.cli:main"
